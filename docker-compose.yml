# SehatAI -- the whole stack, one command:
#
#   cp .env.example .env      # fill in DATABASE_URL, SECRET_KEY and API keys
#   docker compose up --build -d
#   open http://localhost:8080
#
# Six containers on one private network. ONLY the gateway publishes a port;
# it routes /, /api, /sehatai and /evidence to the right service (see
# gateway/nginx.conf), so the browser sees a single origin -- no CORS, and
# the same build works on localhost, a LAN IP, or a cloud VM.
#
#   gateway            nginx      :80 -> host ${SEHAT_PORT:-8080}
#   carelink-frontend  web UI     :3002 (internal)
#   carelink-backend   core API   :8000 (internal)  + DataFetch OCR pipeline
#   sehatai-backend    AI chat    :3000 (internal)
#   evidenceboard      evidence   :8002 (internal, doctors only via gateway)
#   dietbot            diet recs  :8001 (internal, sehatai-backend only)
#
# Configuration: ONE root .env file, shared by every service (env_file
# below). Nothing secret lives in this file or in any image.

x-service-defaults: &service-defaults
  restart: unless-stopped
  env_file: .env
  networks: [sehat]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  gateway:
    <<: *service-defaults
    build:
      context: ./gateway
    ports:
      - "${SEHAT_PORT:-8080}:80"
    depends_on:
      carelink-frontend:
        condition: service_healthy
      carelink-backend:
        condition: service_healthy
      sehatai-backend:
        condition: service_healthy
      evidenceboard:
        condition: service_healthy

  carelink-frontend:
    <<: *service-defaults
    build:
      context: ./frontend
    environment:
      # Same-origin paths through the gateway (see frontend_main.py).
      PUBLIC_API_BASE: /api
      PUBLIC_SEHATAI_BASE: /sehatai
      PUBLIC_EVIDENCE_BASE: /evidence

  carelink-backend:
    <<: *service-defaults
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # Refuses to start with the public dev JWT secret (security.py).
      APP_ENV: ${APP_ENV:-production}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
    volumes:
      # Uploaded reports/prescriptions/avatars survive container recreation.
      - carelink-uploads:/app/backend/app/static/uploads
      - carelink-avatars:/app/backend/app/static/avatars
    stop_grace_period: 30s

  sehatai-backend:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Inside this network "dietbot" resolves via Docker DNS; localhost
      # would mean this container itself.
      DIETBOT_API_URL: http://dietbot:8001
    depends_on:
      dietbot:
        condition: service_healthy
    stop_grace_period: 30s

  evidenceboard:
    <<: *service-defaults
    build:
      context: ./sehatEvidence
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8002"
      # Question-history/cache DB on the persisted volume below.
      DB_PATH: /app/data/evidenceboard.db
    volumes:
      - evidenceboard-db:/app/data

  dietbot:
    <<: *service-defaults
    build:
      context: ./dietbot
    volumes:
      - dietbot-sessions:/app/sessions

networks:
  sehat:

volumes:
  carelink-uploads:
  carelink-avatars:
  evidenceboard-db:
  dietbot-sessions:
