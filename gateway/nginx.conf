# SehatAI gateway -- the ONE public entry point of the stack.
#
# Every service sits behind this on the internal Docker network; only this
# container publishes a port. The browser sees a single origin:
#
#   /             -> carelink-frontend:3002   (the web UI)
#   /api/         -> carelink-backend:8000    (core API, prefix stripped)
#   /sehatai/     -> sehatai-backend:3000     (AI symptom/diet assistant)
#   /evidence/    -> evidenceboard:8002       (Clinical Evidence, doctors only)
#
# Same-origin means no CORS anywhere, and the app works on any host name
# (localhost, a LAN IP for a judge's laptop, a cloud VM) with zero rebuilds.
# DietBot is deliberately absent: it is internal-only (sehatai-backend
# calls it over the Docker network).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    log_format main '$remote_addr "$request" $status $body_bytes_sent '
                    'rt=$request_time upstream=$upstream_response_time rid=$request_id';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # Lab reports / prescriptions are capped at 20 MB by the API itself.
    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Brute-force damping in front of the API's own per-IP limits.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=ai:10m rate=30r/m;
    limit_req_status 429;

    # Static assets are content-versioned (?v=<hash>, see frontend_main.py),
    # so they can be cached hard without ever serving a stale build.
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:10m max_size=100m inactive=7d use_temp_path=off;

    upstream frontend  { server carelink-frontend:3002; keepalive 16; }
    upstream backend   { server carelink-backend:8000;  keepalive 32; }
    upstream sehatai   { server sehatai-backend:3000;   keepalive 16; }
    upstream evidence  { server evidenceboard:8002;     keepalive 8; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 80;
        server_name _;

        # Applied to every response, including proxied ones.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Request-ID $request_id always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        location = /gateway/health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # ---------------------------------------------------------- core API
        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://backend/auth/;
        }

        # Lab-report upload waits up to ~3 min for OCR (see
        # backend/app/routers/lab_reports.py's REQUEST_WAIT_SECONDS).
        location = /api/me/lab-reports {
            proxy_read_timeout 240s;
            proxy_send_timeout 240s;
            proxy_request_buffering on;
            proxy_pass http://backend/me/lab-reports;
        }

        # AI report summaries walk a provider fallback chain.
        location ~ ^/api/reports/[0-9]+/ai-summary$ {
            limit_req zone=ai burst=10 nodelay;
            proxy_read_timeout 300s;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend;
        }

        location /api/ {
            proxy_read_timeout 60s;
            proxy_pass http://backend/;
        }

        # ------------------------------------------- AI symptom/diet assistant
        # Its own bearer-token auth (minted by the core API's
        # /me/sehatai-token) is checked by the service itself.
        location /sehatai/ {
            limit_req zone=ai burst=20 nodelay;
            proxy_read_timeout 300s;
            proxy_pass http://sehatai/;
        }

        # ------------------------------------------------ Clinical Evidence
        # EvidenceBoard has no login of its own, so the gateway requires a
        # valid CareLink DOCTOR token before anything reaches it.
        location = /_auth/doctor {
            internal;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://backend/auth/verify?role=doctor;
        }

        # Health stays public so the UI's status dot works before login.
        location = /evidence/api/health {
            proxy_pass http://evidence/api/health;
        }

        location /evidence/ {
            auth_request /_auth/doctor;
            limit_req zone=ai burst=10 nodelay;
            # /api/ask/stream is NDJSON streamed live -- never buffer it.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 900s;
            proxy_pass http://evidence/;
        }

        # --------------------------------------------------------------- UI
        location /static/ {
            proxy_cache static;
            proxy_cache_valid 200 7d;
            proxy_cache_key $scheme$host$request_uri;
            add_header Cache-Control "public, max-age=604800, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Content-Type-Options "nosniff" always;
            proxy_pass http://frontend;
        }

        location / {
            proxy_pass http://frontend;
        }

        error_page 502 503 504 /gateway/unavailable.json;
        location = /gateway/unavailable.json {
            internal;
            default_type application/json;
            return 503 '{"detail":"This service is starting up or temporarily unavailable. Please retry in a moment."}';
        }
    }
}
