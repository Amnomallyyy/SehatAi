<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SehatAI Assistant</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #1d2430;
    --muted: #6b7380;
    --line: #e2e5ea;
    --user: #2c3e50;
    --user-text: #ffffff;
    --bot: #eef0f3;
    --accent: #2c3e50;
    --danger: #b42318;
    --danger-bg: #fdecea;
    --ok: #1f7a4d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a;
      --panel: #1a1e25;
      --text: #e6e8ec;
      --muted: #9aa2ad;
      --line: #2a2f38;
      --user: #3b5168;
      --user-text: #ffffff;
      --bot: #232832;
      --accent: #8fb3d9;
      --danger: #ff8a80;
      --danger-bg: #3a1f1f;
      --ok: #6fcf97;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 760px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; }
  header p { margin: 0; font-size: 13px; color: var(--muted); }
  button {
    font: inherit;
    font-size: 14px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #thread {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.emergency { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
  .msg.error { color: var(--danger); }
  .specialist { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-weight: 600; color: var(--ok); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .actions button { background: var(--panel); }
  .typing { align-self: flex-start; color: var(--muted); font-size: 14px; padding: 4px 6px; }
  .note { align-self: center; font-size: 13px; color: var(--muted); }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }
  textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    font: inherit;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--text);
    max-height: 140px;
  }
  textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  form button { background: var(--accent); color: var(--panel); border-color: var(--accent); padding: 0 18px; }
  @media (max-width: 600px) {
    .app { border: 0; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>SehatAI Assistant</h1>
      <p>Tells you which kind of doctor to see. It does not diagnose.</p>
    </div>
    <button id="newBtn" type="button">New conversation</button>
  </header>

  <div id="thread" aria-live="polite"></div>

  <form id="form">
    <textarea id="input" rows="1" dir="auto" placeholder="Describe how you feel… (Enter to send)" aria-label="Message"></textarea>
    <button id="sendBtn" type="submit">Send</button>
  </form>
</div>

<script>
  const thread = document.getElementById('thread');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const GREETING = "Hi — I'm here to help you figure out which kind of doctor to see. What symptoms are you experiencing, and how long have you had them?";

  // The first message after opening the page (or "New conversation")
  // starts a fresh server-side session instead of resuming an old one.
  let startFresh = true;
  let busy = false;

  function scrollDown() { thread.scrollTop = thread.scrollHeight; }

  function addUser(text) {
    const el = document.createElement('div');
    el.className = 'msg user';
    el.dir = 'auto';
    el.textContent = text;
    thread.appendChild(el);
    scrollDown();
  }

  function addNote(text) {
    const el = document.createElement('div');
    el.className = 'note';
    el.textContent = text;
    thread.appendChild(el);
    scrollDown();
  }

  function addBot(result) {
    const el = document.createElement('div');
    const kind = result.kind || 'unknown';
    el.className = 'msg bot' + (kind === 'emergency' ? ' emergency' : '') + (kind === 'error' ? ' error' : '');
    el.dir = 'auto';
    const text = document.createElement('div');
    text.textContent = result.reply || '(no reply)';
    el.appendChild(text);

    const specialist = result.recommendation && result.recommendation.specialist_recommended;
    if (kind === 'recommendation' && specialist) {
      const s = document.createElement('div');
      s.className = 'specialist';
      s.textContent = '→ ' + specialist + (result.secondarySpecialist ? '   ·   → ' + result.secondarySpecialist : '');
      el.appendChild(s);
    }

    if (result.actionable && Array.isArray(result.actions) && result.actions.length) {
      const row = document.createElement('div');
      row.className = 'actions';
      for (const action of result.actions) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = action.label;
        b.addEventListener('click', () => {
          row.querySelectorAll('button').forEach((x) => { x.disabled = true; });
          if (action.id === 'notify') {
            addNote('Please call your local emergency number now, or contact someone you trust to be with you.');
          } else {
            send(action.label);
          }
        });
        row.appendChild(b);
      }
      el.appendChild(row);
    }
    thread.appendChild(el);
    scrollDown();
  }

  async function send(text) {
    if (busy || !text.trim()) return;
    busy = true;
    sendBtn.disabled = true;
    addUser(text);
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.textContent = 'SehatAI is typing…';
    thread.appendChild(typing);
    scrollDown();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'symptom', message: text, newSession: startFresh }),
      });
      const result = await res.json();
      startFresh = false;
      typing.remove();
      addBot(res.ok ? result : { kind: 'error', reply: result.error || ('Error ' + res.status) });
    } catch (err) {
      typing.remove();
      addBot({ kind: 'error', reply: "Couldn't reach the assistant. Is the server still running?" });
    } finally {
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value;
    input.value = '';
    input.style.height = 'auto';
    send(text);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.getElementById('form').requestSubmit();
    }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  document.getElementById('newBtn').addEventListener('click', async () => {
    if (busy) return;
    try {
      await fetch('/api/session/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'symptom' }),
      });
    } catch {}
    startFresh = true;
    thread.innerHTML = '';
    addBot({ kind: 'greeting', reply: GREETING });
    input.focus();
  });

  if (location.protocol === 'file:') {
    addBot({ kind: 'error', reply: 'This page was opened as a file, so it can\'t reach the chatbot. Run "npm run chat:web" in the SehatAi folder, then open http://localhost:3000 instead.' });
    sendBtn.disabled = true;
  } else {
    addBot({ kind: 'greeting', reply: GREETING });
    input.focus();
  }
</script>
</body>
</html>
